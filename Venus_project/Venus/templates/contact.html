<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inscription</title>
    {% load django_bootstrap5%}
    {% load static %}
    <link rel="stylesheet" href=" {% static 'w3.css'%}">
    <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet">
    <style>
        @import url("https://fonts.googleapis.com/css?family=Poppins:wight@300;400;500;600;700;800;900&display-swap");
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Poppins", sans-serif;
        }
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: url('/static/image1.jpeg') no-repeat;
            background-size: cover;
            background-position: center;
        }
        .wrapper {
            width: 500px;
            background: transparent;
            border: 2px solid transparent;
            border-radius: 10px;
            padding: 10px 20px;
        }
        .wrapper h1 {
            font-size: 30px;
            text-align: center;
        }
        .wrapper, input-inbox {
            position: center;
            width: 40%;
            height: 350px;
            background: transparent;
            border: 1px solid rgba(255, 255, 255, 2);
            backdrop-filter: blur(10px);
            box-shadow: 0 0 10px rgba(0, 0, 0, 2);
            color: #fff;
            margin: 30px, 0;
        }
        .input-box input {
            width: 50%;
            height: 50px;
            background: transparent;
            border: none;
            outline: none;
            border: 2px solid rgba(255, 255, 255, 2);
            border-radius: 10px;
            font-size: 16px;
            color: #fff;
            padding: 20px 45px 20px 20px;
        }
        .input-box input::placeholder {
            color: #fff;
        }
        .input-box i {
            position: absolute;
            right: 20px;
            top: 50px;
            transform: translateY(50%);
            font-size: 20px;
        }
        .wrapper .remember-forgot {
            display: flex;
            justify-content: space-between;
            font-size: 14.5px;
            margin: -15px 0 15px;
            color: #fff;
        }
        .remember-forgot label input {
            accent-color: #fff;
            text-decoration: none;
        }
        .remember-forgot a:hover {
            text-decoration: underline;
        }
        .wrapper .btn {
            width: 30%;
            height: 45px;
            background: #fff;
            border: none;
            outline: none;
            border-radius: 40px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 1);
            cursor: pointer;
            font-size: 16px;
            color: black;
            font-weight: 600;
        }
        .wrapper, .register-link {
            font-size: 14.5px;
            text-align: center;
            margin: 20px 0 15px;
        }
        .register-link p {
            color: #fff;
            text-decoration: none;
            font-weight: 600;
        }
        .register-link a {
            color: #fff;
            text-decoration: none;
            font-weight: 600;
        }
        .register-link p a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
<div class="wrapper">
        <form action="{% url 'contact' %}" method="post">
            {% csrf_token %}
            <h1>Contactez-nous</h1>
            <br>
            <br>
            <div class="input-box">
                <input type="text" name="username" placeholder="nom d'utilisateur" required>
            </div>
            <br>
            <div class="input-box">
                <input type="question" name="question" placeholder="Vous avez une question?" required>
                <i class="bx bxs-lock-alt"></i>
            </div>
            <br>
            
            <button type="submit" class="btn">Soumettre</button>
            
        </form>
    </div>
</body>
</html>
