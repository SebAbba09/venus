<!DOCTYPE html>
<html lang="fr">
<head>
    {% load static %}
    {% load django_bootstrap5 %}
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calendrier Venus Chatbot</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/fullcalendar@6.0.1/main.min.css" rel="stylesheet">
    <style>
        .calendar-container {
            margin: 20px;
            padding: 20px;
            background: rgba(255, 255, 255, 0.9);
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }
    </style>
</head>
<body>

<!-- Formulaire pour Ajouter/Modifier des Événements -->
<div id="event-modal" class="modal fade" tabindex="-1" role="dialog" aria-labelledby="eventModalLabel" aria-hidden="true">
    <div class="modal-dialog" role="document">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="eventModalLabel">Ajouter un Événement</h5>
                <button type="button" class="close" data-dismiss="modal" aria-label="Close">
                    <span aria-hidden="true">&times;</span>
                </button>
            </div>
            <div class="modal-body">
                <form id="event-form">
                    <div class="form-group">
                        <label for="title">Titre de l'Événement</label>
                        <input type="text" id="title" class="form-control" placeholder="Titre" required>
                    </div>
                    <div class="form-group">
                        <label for="description">Description</label>
                        <textarea id="description" class="form-control" placeholder="Description"></textarea>
                    </div>
                    <div class="form-group">
                        <label for="start_time">Date et Heure de Début</label>
                        <input type="datetime-local" id="start_time" class="form-control" required>
                    </div>
                    <div class="form-group">
                        <label for="end_time">Date et Heure de Fin</label>
                        <input type="datetime-local" id="end_time" class="form-control" required>
                    </div>
                    <input type="hidden" id="event_id">
                    <button type="submit" class="btn btn-primary">Enregistrer</button>
                </form>
            </div>
        </div>
    </div>
</div>


    <div class="container calendar-container">
        <div id="calendar"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@fullcalendar/core@6.0.1/main.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@fullcalendar/daygrid@6.0.1/main.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@fullcalendar/interaction@6.0.1/main.min.js"></script>


<script>
document.addEventListener('DOMContentLoaded', function() {
    const calendarEl = document.getElementById('calendar');
    const modal = new bootstrap.Modal(document.getElementById('event-modal'));
    const form = document.getElementById('event-form');

    let calendar = new FullCalendar.Calendar(calendarEl, {
        plugins: [ 'dayGrid', 'interaction' ],
        editable: true,
        events: function(fetchInfo, successCallback, failureCallback) {
            fetch('/calendar/api/events/')
                .then(response => response.json())
                .then(data => successCallback(data))
                .catch(error => failureCallback(error));
        },
        dateClick: function(info) {
            document.getElementById('event_id').value = '';
            document.getElementById('title').value = '';
            document.getElementById('description').value = '';
            document.getElementById('start_time').value = info.dateStr;
            document.getElementById('end_time').value = info.dateStr;
            document.querySelector('.modal-title').textContent = 'Ajouter un Événement';
            modal.show();
        },
        eventClick: function(info) {
            document.getElementById('event_id').value = info.event.id;
            document.getElementById('title').value = info.event.title;
            document.getElementById('description').value = info.event.extendedProps.description;
            document.getElementById('start_time').value = info.event.startStr;
            document.getElementById('end_time').value = info.event.endStr;
            document.querySelector('.modal-title').textContent = 'Modifier l\'Événement';
            modal.show();
        }
    });
    calendar.render();

    form.addEventListener('submit', function(event) {
        event.preventDefault();

        const eventId = document.getElementById('event_id').value;
        const title = document.getElementById('title').value;
        const description = document.getElementById('description').value;
        const start_time = document.getElementById('start_time').value;
        const end_time = document.getElementById('end_time').value;

        let method, url;
        if (eventId) {
            method = 'PUT';
            url = `/calendar/api/events/update/${eventId}/`;
        } else {
            method = 'POST';
            url = '/calendar/api/events/create/';
        }

        fetch(url, {
            method: method,
            headers: {
                'Content-Type': 'application/json',
                'X-CSRFToken': document.querySelector('[name=csrfmiddlewaretoken]').value
            },
            body: JSON.stringify({ title, description, start_time, end_time })
        })
        .then(response => response.json())
        .then(data => {
            alert('Événement enregistré avec succès');
            calendar.refetchEvents();
            modal.hide();
        })
        .catch(error => alert('Erreur: ' + error));
    });
});
</script>

</body>
</html>
