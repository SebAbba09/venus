<script src="{% static 'bootstrap.bundle.min.js' %}"></script>
<script src="{% static 'sidebars.js' %}"></script>

<script>
    let translateToFrench = false ; // Variable d'état pour suivre l'état de la traduction

    // Fonction pour basculer la visibilité de la barre latérale
    document.querySelector('.sidebar-toggle').addEventListener('click', function () {
        document.querySelector('.sidebar').classList.toggle('show');
        document.querySelector('.main-content').classList.toggle('shift');
    });

    // Fonction pour basculer la traduction en français
    document.getElementById('translateButton').addEventListener('click', function () {
        translateToFrench = !translateToFrench; // Alterner l'état de la traduction
        this.textContent = translateToFrench ? 'Traduire en Anglais' : 'Traduire en Français'; // Mettre à jour le texte du bouton

        if (translateToFrench) {
            translateConversationToFrench(); // Traduire toute la conversation si l'utilisateur active la traduction
        }
    });

    // Fonction pour traduire le texte
    async function translateText (text, targetLanguage = 'fr') {
        try {
            const response = await fetch("{% url 'translate' %}", {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'X-CSRFToken': getCookie('csrftoken')
                },
                body: JSON.stringify({
                    text: text,
                    target_language: targetLanguage
                })
            });
            const data = await response.json();
            if (response.ok) {
                return data.translated_text || text;
            } else {
                console.error('Translation error:', data.error);
                return text;
            }
        } catch (error) {
            console.error('Error:', error);
            return text ; // Retourner le texte original en cas d'erreur
        }
    }



    // Fonction pour envoyer un message
async function sendMessage() {
    const userMessage = document.getElementById('user-message').value;
    if (!userMessage.trim()) return;

    // Traduire le message de l'utilisateur en anglais avant l'envoi si nécessaire
    const userMessageToSend = translateToFrench ? await translateText(userMessage, 'en') : userMessage;

    // Ajouter le message de l'utilisateur au chat
    appendMessage (userMessage, 'user', "https://api.dicebear.com/9.x/adventurer/svg?seed=Mia");

    // Envoyer le message au serveur
    const response = await fetch("{% url 'chat' %}", {
        method: 'POST',
        headers: {
            'Content-Type': 'application/json',
            'X-CSRFToken': '{{ csrf_token }}'
        },
        body: JSON.stringify({ message: userMessageToSend, translate_to_french: translateToFrench })
    });

    const data = await response.json();

    if (data.response) {
        // Traduire la réponse du bot en français si nécessaire
        const botResponse = translateToFrench ? await translateText(data.response, 'fr') : data.response;

        // Ajouter la réponse du bot au chat
        appendMessage(botResponse, 'bot', '/static/casper.jpg'); // Remplacez par l'URL de l'avatar du bot

        // Effacer le champ de saisie pour permettre l'envoi d'un nouveau message
        document.getElementById('user-message').value = '';
    } else {
        console.error('Erreur dans la réponse du bot:', data.error);
    }
}

// Fonction pour ajouter un message au chat
function appendMessage(message, sender, avatar) {
    const chatBody = document.getElementById('chat-body');
    const messageElement = document.createElement('div');
    messageElement.classList.add('chat-message', sender);

    const avatarElement = document.createElement('img');
    avatarElement.src = avatar;
    avatarElement.alt = 'Avatar';
    avatarElement.classList.add('avatar');

    const textElement = document.createElement('div');
    textElement.classList.add('message');
    textElement.textContent = message;

    messageElement.appendChild(avatarElement);
    messageElement.appendChild(textElement);
    chatBody.appendChild(messageElement);

    // Faire défiler vers le bas pour voir le dernier message
    chatBody.scrollTop = chatBody.scrollHeight;
}


    // Écouter le clic sur le bouton d'envoi de message
    document.getElementById('sendMessage').addEventListener('click', sendMessage);

    // Nouvelle fonction pour traduire toute la conversation en français
    function translateConversationToFrench() {
        fetch("{% url 'chat' %}", {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
            },
            body: JSON.stringify({
                translate_conversation: true
            }),
        })
        .then(response => response.json())
        .then(data => {
            const conversation = data.conversation;
            // Mettez à jour l'affichage de la conversation avec la version traduite
            updateChatDisplay(conversation);
        })
       .catch(function(error) {
    var errorMessage = {
        status: 'error',
        message: error.toString()
    };
  var errorMessage = {
    status: 'error',
    message: error.toString()
};

console.log('Error: ' + JSON.stringify(errorMessage));

});

    }

    // Nouvelle fonction pour mettre à jour l'affichage du chat avec la conversation traduite
    function updateChatDisplay(conversation) {
        // Videz le corps du chat
        const chatBody = document.getElementById('chat-body');
        chatBody.innerHTML = '';

        // Parcourez chaque message de la conversation traduite et ajoutez-le au chat
        conversation.forEach(message => {
            appendMessage(message.text, message.sender, message.avatarUrl);
        });

        // Faites défiler jusqu'à la fin du chat
        chatBody.scrollTop = chatBody.scrollHeight;
    }

    function getCookie(name) {
    let cookieValue = null;
    if (document.cookie && document.cookie !== '') {
        const cookies = document.cookie.split(';');
        for (let i = 0; i < cookies.length; i++) {
            const cookie = cookies[i].trim();
            // Does this cookie string begin with the name we want?
            if (cookie.substring(0, name.length + 1) === (name + '=')) {
                cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
                break;
            }
        }
    }
    return cookieValue;
}
const csrftoken = getCookie('csrftoken');

// Lorsque vous envoyez la requête POST

    body: JSON.stringify({

        translate_to_french: "false"
    })
}).then(response => response.json())
  .then(data => console.log(data));

</script>
