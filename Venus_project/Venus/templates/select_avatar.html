    <style>
     /* Animation de zoom */
        .zoom-in-out {
            animation: zoomInOut 0.6s;
        }

        @keyframes zoomInOut {
            0% {
                transform: scale(1);
                opacity: 1;
            }
            50% {
                transform: scale(1.2);
                opacity: 0.5;
            }
            100% {
                transform: scale(1);
                opacity: 1;
            }
        }

        /* Animation de transition */
        .fade-out {
            animation: fadeOut 1s forwards;
        }

        @keyframes fadeOut {
            from {
                opacity: 1;
            }
            to {
                opacity: 0;
            }
        }

        .header {
            background: #7b1fa2;
            color: white;
            padding: 10px;
            text-align: center;
            border-radius: 0 0 10px 10px;
            width: 100%;
        }
        body {
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            align-items: center;
            height: 100vh;
            margin: 0;
            background: linear-gradient(120deg, #FF7E5F, #FD3A84, #6A0572);
            color: white;
        }
        .main-avatar {
            margin-top: 20px;
            text-align: center;
        }
        .main-avatar img {
            height: 200px;
        }
        .gallery-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            margin-top: 20px;
        }
        .gallery {
            border: 1px solid #ccc;
            margin: 5px;
            cursor: pointer;
        }
        .gallery:hover {
            border: 1px solid #777;
        }
        .gallery img {
            width: 100px;
            height: 100px;
            object-fit: cover;
        }
    </style>
</head>

     <script>
        let selectedAvatar = 'Callie';  // Avatar par défaut

        function updateMainAvatar(name) {
            const mainAvatar = document.getElementById('mainAvatar');
            mainAvatar.classList.add('zoom-in-out'); // Ajouter l'animation
            mainAvatar.src = `https://api.dicebear.com/9.x/adventurer/svg?seed=${name}`;
            selectedAvatar = name;  // Mettre à jour le nom de l'avatar sélectionné

            // Retirer l'animation après sa fin
            setTimeout(() => {
                mainAvatar.classList.remove('zoom-in-out');
            }, 600); // Correspond à la durée de l'animation

            // Afficher le bouton "Valider" après la sélection d'un avatar

        }

        function selectAvatar() {
            alert(`Avatar sélectionné: ${selectedAvatar}`);
            // Masquer le bouton de sélection et afficher le bouton de modification
            document.getElementById('selectButton').style.display = 'none';
            document.getElementById('validateButton').style.display = 'inline-block';
            document.getElementById('changeButton').style.display = 'inline-block';
            // Désactiver la galerie d'avatars pour éviter les changements
            document.querySelectorAll('.gallery').forEach(gallery => {
                gallery.style.pointerEvents = 'none';
            });
        }

        function validateAvatar() {
            alert(`Avatar validé: ${selectedAvatar}`);
            // Masquer le bouton de validation et afficher le bouton de modification
            document.getElementById('selectButton').style.display = 'none';
            document.getElementById('validateButton').style.display = 'inline-block';
            // Désactiver la galerie d'avatars pour éviter les changements
            document.querySelectorAll('.gallery').forEach(gallery => {
                gallery.style.pointerEvents = 'none';
            });
            // Rediriger vers la page 'chat_form'
    setTimeout(() => {
        window.location.href = "{% url 'chat_form' %}";
    }, 1000);
        }


        function enableAvatarChange() {
            // Afficher le bouton de sélection et masquer le bouton de modification
            document.getElementById('selectButton').style.display = 'inline-block';
            document.getElementById('changeButton').style.display = 'none';
            // Activer la galerie d'avatars pour les changements
            document.querySelectorAll('.gallery').forEach(gallery => {
                gallery.style.pointerEvents = 'auto';
            });
        }
