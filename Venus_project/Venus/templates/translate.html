<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Translation Interface</title>
    {% load django_bootstrap5%}
    {% load static %}
    <style>

        body {
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            background: #f5f5f5;
            color: #333;
        }
        #translation-container {
            width: 90%;
            max-width: 600px;
            background: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            overflow-y: auto;
            max-height: 400px;
            margin-bottom: 20px;
        }
        #text-input {
            width: 70%;
            padding: 10px;
            border-radius: 4px;
            border: 1px solid #ddd;
            margin-right: 10px;
        }
        button {
            padding: 10px 20px;
            border: none;
            border-radius: 4px;
            background-color: #4caf50;
            color: #fff;
            cursor: pointer;
        }
        button:hover {
            background-color: #45a049;
        }
        #buttons-container {
            display: flex;
            justify-content: space-between;
            width: 90%;
            max-width: 600px;
        }
    </style>
</head>
<body>
    <div id="translation-container">
        <div id="translation-log"></div>
        <div id="buttons-container">
            <input type="text" id="text-input" placeholder="Tapez votre message...">
            <button onclick="translateMessage()">Traduire</button>
            <button onclick="clearTranslation()">Effacer</button>
        </div>
    </div>

    <script>
        function translateMessage() {
            const input = document.getElementById('text-input');
            const message = input.value;

            // Appeler l'API de traduction via une requête fetch
            fetch('/translate/', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'X-CSRFToken': getCookie('csrftoken')
                },
                body: JSON.stringify({ 'message': message })
            })
            .then(response => response.json())
            .then(data => {
                const translationLog = document.getElementById('translation-log');
                const messageElement = document.createElement('div');
                messageElement.textContent = 'Traduction: ' + data.translated_message;
                translationLog.appendChild(messageElement);
            });

            input.value = '';
        }

        function clearTranslation() {
            const translationLog = document.getElementById('translation-log');
            translationLog.innerHTML = '';
        }

        // Fonction pour obtenir le token CSRF
        function getCookie(name) {
            let cookieValue = null;
            if (document.cookie && document.cookie !== '') {
                const cookies = document.cookie.split(';');
                for (let i = 0; i < cookies.length; i++) {
                    const cookie = cookies[i].trim();
                    if (cookie.substring(0, name.length + 1) === (name + '=')) {
                        cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
                        break;
                    }
                }
            }
            return cookieValue;
        }
    </script>
</body>
</html>
