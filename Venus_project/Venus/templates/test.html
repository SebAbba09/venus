<!DOCTYPE html>
<html lang="en">
<head>
     {% load static %}
   {% load django_bootstrap5%}
    {% bootstrap_css %}
    {% bootstrap_javascript %}
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <title>Avatar Gallery</title>

   

    <style>
       
         .gallery {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
        }
        .gallery label {
            display: flex;
            flex-direction: column;
            align-items: center;
            cursor: pointer;
        }
        .gallery img {
            width: 100px;
            height: 100px;
            object-fit: cover;
            border: 2px solid transparent;
            border-radius: 50%;
            transition: border-color 0.3s ease;
        }
        .gallery input[type="radio"] {
            display: none;
        }
        .gallery input[type="radio"]:checked + img {
            border-color: #007bff;
        }
        .gallery label:hover img {
            border-color: #007bff;
        }
    </style>
</head>
<body>
    <div class="container mt-5">
        <h1 class ="centered-heading">Galerie d'avatars</h1>
        <form method="post">
            {% csrf_token %}
            <div class="gallery">
                {% for name in names %}
                <label>
                    <input type="radio" name="avatar" value="{{ name }}" {% if name == selected_avatar %}checked{% endif %}>
                    <img src="https://api.dicebear.com/9.x/adventurer/svg?seed={{ name }}" alt="{{ name }}">
                </label>
                {% endfor %}
            </div>
            <button type="submit" class="btn btn-primary mt-3">Sélectionner</button>
        </form>
        <h2 class="mt-5">Avatar sélectionné : {{ selected_avatar }}</h2>
    </div>
</body>
</html>
