<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chatbot Analysis</title>
   {% load django_bootstrap5%}
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #f4f4f4;
        }
        .container {
            max-width: 800px;
            margin: auto;
            padding: 20px;
            background-color: #fff;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }
        h1 {
            font-size: 24px;
            margin-bottom: 20px;
        }
        textarea {
            width: 100%;
            height: 100px;
            padding: 10px;
            margin-bottom: 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
        }
        button {
            padding: 10px 20px;
            border: none;
            border-radius: 4px;
            color: #fff;
            background-color: #007bff;
            cursor: pointer;
            font-size: 16px;
        }
        button:hover {
            background-color: #0056b3;
        }
        .result {
            margin-top: 20px;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
            background-color: #f9f9f9;
        }
        .result h3 {
            margin: 0;
            font-size: 18px;
        }
        .error {
            color: red;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Chatbot Analysis</h1>

        <!-- Section for Sentiment Analysis -->
        <section id="sentiment-analysis">
            <h2>Analyze Sentiment</h2>
            <textarea id="sentiment-text" placeholder="Enter your message for sentiment analysis..."></textarea>
            <button onclick="analyzeSentiment()">Analyze Sentiment</button>
            <div id="sentiment-result" class="result"></div>
        </section>

        <!-- Section for Translation -->
        <section id="translation">
            <h2>Translate Message</h2>
            <textarea id="translation-text" placeholder="Enter your message to translate..."></textarea>
            <select id="language-select">
                <option value="fr">French</option>
                <option value="en">English</option>
            </select>
            <button onclick="translateMessage()">Translate</button>
            <div id="translation-result" class="result"></div>
        </section>
    </div>

    <script>
        async function analyzeSentiment() {
            const message = document.getElementById('sentiment-text').value;

            const response = await fetch('/analyze-sentiment/', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'X-CSRFToken': getCookie('csrftoken')
                },
                body: JSON.stringify({ message })
            });

            const data = await response.json();
            const sentimentResult = document.getElementById('sentiment-result');

            if (response.ok) {
                sentimentResult.innerHTML = `<h3>Sentiment Analysis Result:</h3><p>Sentiment Score: ${data.sentiment}</p>`;
            } else {
                sentimentResult.innerHTML = `<p class="error">Error: ${data.error}</p>`;
            }
        }

        async function translateMessage() {
            const message = document.getElementById('translation-text').value;
            const targetLanguage = document.getElementById('language-select').value;

            const response = await fetch('/translate-message/', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'X-CSRFToken': getCookie('csrftoken')
                },
                body: JSON.stringify({ message, target_language: targetLanguage })
            });

            const data = await response.json();
            const translationResult = document.getElementById('translation-result');

            if (response.ok) {
                translationResult.innerHTML = `<h3>Translation Result:</h3><p>${data.translated_message}</p>`;
            } else {
                translationResult.innerHTML = `<p class="error">Error: ${data.error}</p>`;
            }
        }

        function getCookie(name) {
            let cookieValue = null;
            if (document.cookie && document.cookie !== '') {
                const cookies = document.cookie.split(';');
                for (let i = 0; i < cookies.length; i++) {
                    const cookie = cookies[i].trim();
                    if (cookie.substring(0, name.length + 1) === (name + '=')) {
                        cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
                        break;
                    }
                }
            }
            return cookieValue;
        }
    </script>
</body>
</html>
