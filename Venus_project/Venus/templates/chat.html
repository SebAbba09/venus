<!DOCTYPE html>
<html lang="en">
<head>
    {% load static %}
    {% load django_bootstrap5 %}
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Venus Chatbot</title>
    <link href="{% static 'bootstrap.min.css' %}" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <style>
        body {
            margin: 0;
            height: 100vh;
            background: linear-gradient(to right, #FF7E5F, #FEB47B); /* Dégradé de coucher de soleil */
            display: flex;
            flex-direction: row;
        }
        .sidebar {
            width: 280px;
            background-color: #f8f9fa;
            border-right: 1px solid #ddd;
            height: 100vh;
            position: fixed;
            top: 0;
            left: 0;
            display: flex;
            flex-direction: column;
        }
        .main-content {
            margin-left: 280px; /* Ajustez en fonction de la largeur de la barre latérale */
            padding: 20px;
            background-color: rgba(255, 255, 255, 0.8); /* Fond blanc avec une légère transparence pour le contenu principal */
            border-radius: 10px; /* Arrondir les coins du contenu principal */
            height: 100vh;
            overflow-y: auto;
            display: flex;
            flex-direction: column;

        }
        .chat-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            width: 100%;
            max-width: 600px;
            height: 80vh;
            background: white;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        .messages {
            flex: 1;
            overflow-y: auto;
            padding: 10px;
            border-bottom: 1px solid #ddd;
        }
        .message {
            padding: 5px;
            margin-bottom: 5px;
            border-radius: 4px;
            background: #f1f1f1;
        }
        .message.user {
            background: #d1e7dd;
        }
        .message.bot {
            background: #e2e3e5;
        }
        .input-group {
            border-top: 1px solid #ddd;
            padding: 10px;
        }
        .input-group input {
            flex: 1;
            margin-right: 10px;
        }
        .nav-link {
            color: #212529;
        }
        .nav-link.active {
            color: #0d6efd;
        }
    </style>
</head>
<body>
    <!-- Sidebar -->
    <div class="sidebar p-3">
        <a href="/" class="d-flex align-items-center mb-3 mb-md-0 me-md-auto link-body-emphasis text-decoration-none">
            <span class="fs-4">Venus Sidebar</span>
        </a>
        <hr>
        <ul class="nav nav-pills flex-column mb-auto">
            <li class="nav-item">
                <a href="{% url 'accueil' %}" class="nav-link active" aria-current="page">
                    Accueil
                </a>
            </li>
            <li>
                <a href="{% url 'home' %}" class="nav-link">
                    Home
                </a>
            </li>
            <li>
                <a href="{% url 'avatar_gallery' %}" class="nav-link">
                    Avatar
                </a>
            </li>
            <li>
                <a href="{% url 'notifications' %}" class="nav-link">
                    Notifications
                </a>
            </li>
            <li>
                <a href="{% url 'contact' %}" class="nav-link">
                    Contact
                </a>
            </li>
        </ul>
        <hr>
        <div class="dropdown">
            <a href="#" class="d-flex align-items-center link-body-emphasis text-decoration-none dropdown-toggle" data-bs-toggle="dropdown" aria-expanded="false">
                <img src="{% static 'casper.jpg %}" alt="" width="32" height="32" class="rounded-circle me-2">
                <strong>Casper</strong>
            </a>
            <ul class="dropdown-menu text-small shadow">
                <li><a class="dropdown-item" href="#">New project...</a></li>
                <li><a class="dropdown-item" href="#">Settings</a></li>
                <li><a class="dropdown-item" href="#">Profile</a></li>
                <li><hr class="dropdown-divider"></li>
                <li><a class="dropdown-item" href="#">Sign out</a></li>
            </ul>
        </div>
    </div>

    <!-- Main content -->
    <main class="main-content">
        <div class="chat-container">
            <div class="messages" id="messages">
                <!-- Les messages du chat seront affichés ici -->
            </div>
            <div class="input-group">
                <input type="text" id="message" placeholder="Type your message...">
                <button id="send_btn" class="btn btn-primary">Send</button>
            </div>
        </div>
    </main>

    <script src="{% static 'venus.js' %}"></script>
</body>
</html>
